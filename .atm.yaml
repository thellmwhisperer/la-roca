# ATM's configuration for this repository. Every key is required; an empty value is a deliberate "none".
install: ""
# Unit and contract tests; the heavier suites run in delivery through no-mistakes.
test: make test
typecheck: make typecheck
lint: make lint
test_file: make test-file DIR={dir}
test_patterns: ["**/*_test.go", "features/**", "test/**", "testdata/**"]
docs_patterns: ["**/*.md", "docs/**"]
# Delivery runs scripts/deliver.sh: no-mistakes in the foreground without --yes, so ATM's screen paints its steps
# with no second screen. Whoever launched the run answers each gate. Pull requests target integration, the
# repository's default branch and the release-train branch (docs/release-train.md).
# It starts with sh because ATM's preflight only accepts a delivery whose first word is on PATH or a word of sh.
delivery: sh scripts/deliver.sh
