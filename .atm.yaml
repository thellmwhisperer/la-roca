# ATM's configuration for this repository. Every key is required; an empty value is a deliberate "none".
install: ""
# Unit and contract tests; the heavier suites run in delivery through no-mistakes.
test: make test
typecheck: make typecheck
lint: make lint
test_file: make test-file DIR={dir}
test_patterns: ["**/*_test.go", "features/**", "test/**", "testdata/**"]
docs_patterns: ["**/*.md", "docs/**"]
# Delivery runs scripts/atm-delivery.sh: it launches no-mistakes without --yes and follows that one run by status,
# with no second screen, so ATM's screen paints the gate. Whoever launched the run answers each gate.
# Pull requests target integration, the release-train branch (docs/release-train.md).
delivery: scripts/atm-delivery.sh
