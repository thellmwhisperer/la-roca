name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every job name this workflow reports is a required check on main. Re-derive
  # that list from a completed CI run when the matrix changes; do not guess labels.
  # versions.txt is the only list of frozen homes. Reading it here turns each
  # committed archive into its own runner, so a failure names the exact
  # historical version in the job list and a new archive adds a job by itself.
  upgrade-homes:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.frozen.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: frozen
        run: echo "versions=$(./scripts/upgrade-gauntlet.sh --versions)" >> "$GITHUB_OUTPUT"

  upgrade-gauntlet:
    needs: upgrade-homes
    runs-on: ubuntu-latest
    strategy:
      # Every historical home is judged: the first red one must not hide which
      # of the others also stopped upgrading.
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.upgrade-homes.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: The frozen home upgrades cleanly
        env:
          UPGRADE_HOME: ${{ matrix.version }}
        run: make upgrade-gauntlet UPGRADE_HOME="$UPGRADE_HOME"

  # The vector plugin is its own Go module, so the root `make check` never sees
  # it: `go vet ./...` and `go test ./...` stop at the module boundary. Its own
  # gate is a job of its own, and a red one names the plugin and not the core.
  vector-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/vector/go.mod
          cache-dependency-path: plugins/vector/go.sum
          cache: true

      - name: Format, vet, tests and build of the vector module
        run: make -C plugins/vector check

  vector-native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/vector/go.mod
          cache-dependency-path: plugins/vector/go.sum
          cache: true
      - name: Native CPU embedding engine
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++
          make -C plugins/vector build-native
          cd plugins/vector && CGO_ENABLED=1 go test ./internal/engine ./internal/model ./internal/telemetry ./internal/vector
          CGO_ENABLED=1 go test -tags=native_equivalence ./internal/vector -run TestNativeEngineMatchesPublicEquivalenceFixture -count=1

  vector-native-darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/vector/go.mod
          cache-dependency-path: plugins/vector/go.sum
          cache: true
      - name: Native Metal embedding engine
        run: |
          make -C plugins/vector build-native
          cd plugins/vector && CGO_ENABLED=1 go test ./internal/engine ./internal/model ./internal/telemetry ./internal/vector
          CGO_ENABLED=1 go test -tags=native_equivalence ./internal/vector -run TestNativeEngineMatchesPublicEquivalenceFixture -count=1

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The slop gate. It is its own step, before `make check` runs it again as
      # part of its chain, so a red build says "slop gate" in the job list
      # instead of "format, vet and tests". The runner is scripts/slopslint.sh:
      # it builds the pinned upstream commit once and caches the platform binary
      # under .tmp/, so another workflow can reuse the exact same gate.
      - name: Slop gate (duplication, orphans and claims)
        run: make slop

      # Native Linux vector payloads need a C++ toolchain. The core stays CGO-free.
      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      # `make check` builds the binary itself and runs the acceptance-tagged
      # suite through its `accept` prerequisite, so there is no separate build
      # or acceptance step: a green check is a green suite over the real binary,
      # on a runner that had nothing an hour ago.
      - name: Build, format, vet, tests and slop gate
        run: make check

      # The core stays a CGO-free cross-compile. Native embedding payloads are
      # built on their own runners; this job still proves the Windows
      # compatibility payload and the host Linux CPU payload.
      - name: Host artefacts and the Windows compatibility payload
        run: make dist

      # The OSS portability guard: an absolute path with a machine name, a user
      # name or a personal mount in production is a build failure.
      - name: Portability guard
        run: ./scripts/portability-guard.sh
