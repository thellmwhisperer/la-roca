name: risk-gate

# Required status check on `main` (recorded in docs/operations.md). Judges the
# PR body's no-mistakes Risk Assessment: High fails, labels `risk:high`,
# converts the PR to draft and requests the owner's review; Medium passes only
# with pasted branch acceptance (`$ roca` command and its output); Low passes.
# The referee script is read from the base branch, so the PR under judgement
# cannot soften its own gate.
on:
  pull_request:
    types: [opened, edited, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

# A body edit cancels the previous verdict; the label write and the verdict
# must not race each other.
concurrency:
  group: risk-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Judge with the gate as the base branch defines it, not with a copy
          # the PR could have edited.
          ref: ${{ github.base_ref }}

      # Bootstrap only: before this workflow lands on the base branch there is
      # no referee there to run, so the first gate PR borrows its own copy.
      # After landing, the base copy always exists and wins.
      - name: Borrow the referee from the PR until the gate is on main
        run: |
          if [ ! -f scripts/risk-gate.sh ]; then
            git fetch --depth=1 origin "${{ github.event.pull_request.head.sha }}"
            git checkout FETCH_HEAD -- scripts/risk-gate.sh
          fi

      - name: Judge the declared risk
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Fork heads (or deleted head repositories) get the verdict without
          # the metadata writes: the workflow token is read-only there.
          RISK_GATE_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: ./scripts/risk-gate.sh
