name: Release

# Release artefacts are produced by this workflow; local builds are never
# published as official releases.
#
# `workflow_dispatch` rebuilds an existing tag without creating a new version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build and publish (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  # Both gauntlet jobs only read the tag they extract archives from, so neither
  # keeps the workflow's write-scoped token in its checkout.
  upgrade-homes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.frozen.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - id: frozen
        run: echo "versions=$(./scripts/upgrade-gauntlet.sh --versions)" >> "$GITHUB_OUTPUT"

  upgrade-gauntlet:
    needs: upgrade-homes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.upgrade-homes.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: The frozen home upgrades cleanly
        env:
          UPGRADE_HOME: ${{ matrix.version }}
        run: make upgrade-gauntlet UPGRADE_HOME="$UPGRADE_HOME"

  native-artifacts:
    needs: upgrade-gauntlet
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            compatibility: false
          - target: linux-amd64
            runner: ubuntu-latest
            compatibility: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            compatibility: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Native build tools
        if: startsWith(matrix.target, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build native release artifacts
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          make "${{ matrix.target }}" VERSION="$VERSION"
          if [ "${{ matrix.compatibility }}" = true ]; then
            make windows-amd64 VERSION="$VERSION"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: bin/roca-*
          if-no-files-found: error

  # One red leg of the matrix fails the whole job, so no historical home can
  # stop upgrading and still be published over.
  publish:
    needs: [upgrade-gauntlet, native-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The tag, and its whole history: `make dist` reads the version from
          # the workflow and not from git, but the acceptance suite and the
          # generated notes want the repository as it really is.
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Native build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      # A release nobody could merge is a release nobody should install. The
      # same gate the pull request had to pass, run again over the tag, because a
      # tag can point anywhere. `make check` builds the binary and runs the
      # acceptance suite as part of `go test ./...`, so it is the whole gate.
      - name: Build, format, vet, tests and slop gate
        run: make check

      # The vector plugin module is outside the root module, so its own gate is
      # replayed over the tag too: a release must not ship a source tree whose
      # installable package no longer builds or passes its tests.
      - name: Format, vet, tests and build of the vector module
        run: make -C plugins/vector check

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: bin
          merge-multiple: true

      - name: Restore executable permissions
        run: find bin -maxdepth 1 -type f -name 'roca-*' ! -name '*.tar.gz' -exec chmod 0755 {} +

      # The Linux core, its materialized vector companion and the standalone
      # vector archive all answer the tag, and the package manifest carries that
      # same version into plugin lifecycle consent and installed inventory.
      - name: The core and vector packages answer the tag they were built from
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          reported=$(./bin/roca-"$VERSION"-linux-x64 --version)
          echo "$reported"
          case "$reported" in
            "roca $VERSION"*) ;;
            *) echo "the binary reports '$reported' and the tag is $VERSION" >&2; exit 1 ;;
          esac
          bundle_home=$(mktemp -d)
          mkdir -p "$bundle_home/bin"
          HOME="$bundle_home" ROCA_PREFIX="$bundle_home/bin" \
            ./bin/roca-"$VERSION"-linux-x64 _install-bundled-plugins --json
          reported=$("$bundle_home/bin/roca-vector" --version)
          echo "$reported"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "the bundled vector binary reports '$reported' and the tag is $VERSION" >&2; exit 1 ;;
          esac
          mkdir -p .tmp/release-vector
          tar -C .tmp/release-vector -xzf bin/roca-vector-"$VERSION"-linux-x64.tar.gz
          plugin_version=$(jq -r .version .tmp/release-vector/plugin.json)
          test "$plugin_version" = "$VERSION" || {
            echo "the vector manifest reports '$plugin_version' and the tag is $VERSION" >&2
            exit 1
          }
          reported=$(.tmp/release-vector/roca-vector --version)
          echo "$reported"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "the vector binary reports '$reported' and the tag is $VERSION" >&2; exit 1 ;;
          esac

      # One `<sha256>  <name>` line per artefact, with bare names: it is what
      # `install.sh` and `roca update` both look their own artefact up by, and
      # an artefact with no line of its own is refused by both.
      - name: checksums.txt
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          cd bin
          sha256sum roca-* > checksums.txt
          cat checksums.txt

      # The binaries first and checksums.txt last, in two commands, because the
      # order is the contract: a checksums.txt published before the artefacts is
      # a window in which an installer verifies against a file describing
      # artefacts that are not there yet.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --verify-tag \
              --title "roca $VERSION" --generate-notes
          gh release upload "$VERSION" --clobber bin/roca-*
          gh release upload "$VERSION" --clobber bin/checksums.txt
