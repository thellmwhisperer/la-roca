name: pr-gate

# Required status check on `main` once green there (recorded in
# docs/operations.md). Judges the PR body's declared Risk Assessment: High
# fails, labels `risk:high` and requests the owner's review; Medium passes
# only with pasted branch acceptance (`$ roca` command and its output); Low
# passes. The referee script is read from the base branch, so the PR under
# judgement cannot soften its own gate.
on:
  pull_request_target:
    types: [opened, edited, synchronize, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

# A body edit cancels the previous verdict; the label write and the verdict
# must not race each other.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Judge with the gate as the base branch defines it, not with a copy
          # the PR could have edited.
          ref: ${{ github.base_ref }}

      - name: Judge the declared risk
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_GATE_ACTION: ${{ github.event.action }}
          PR_GATE_LABEL_NAME: ${{ github.event.label.name }}
          # Fork heads (or deleted head repositories) get the verdict without
          # the metadata writes: the workflow token is read-only there.
          PR_GATE_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          # Optional repo variable naming the reviewer when the owner is an
          # organization and its admins are all PR authors.
          PR_GATE_REVIEWER: ${{ vars.PR_GATE_REVIEWER }}
        run: ./scripts/pr-gate.sh
