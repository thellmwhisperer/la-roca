name: build
on:
  push:
    branches: [main, fm/v1-model-only]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact: roca-linux-x64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact: roca-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            artifact: roca-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact: roca-windows-x64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w -X main.version=$(git describe --tags --always) -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ${{ matrix.artifact }}${{ matrix.ext }} ./cmd/roca
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}
