# Release PRs merge themselves. release-please opens and refreshes one version
# PR; this arms GitHub auto-merge on it, so the moment its required checks are
# green it squashes into main without a human in the loop. Branch protection
# still owns the bar: a red check keeps the PR open. Everything else in the
# repository keeps requiring a human merge.
name: Auto-merge release PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  automerge:
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Arm auto-merge on the release PR
        env:
          # The user-owned token, so the resulting merge triggers downstream
          # workflows exactly like a human merge would.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
