name: release-please

# release-please owns the release PR / version / changelog automation for La
# Roca. It reads conventional commits merged to main, maintains plugin.json +
# CHANGELOG.md, and opens a "release-please" PR that, when merged, tags
# vX.Y.Z and publishes the GitHub release that the existing Release workflow
# builds binaries against.
#
# La Roca auto-merges only the release PR created by this workflow, after its
# required checks pass. Other pull requests retain their normal merge policy.
# RELEASE_PLEASE_TOKEN must be a fine-grained PAT with Contents + Pull requests
# read/write on this repository.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Validate RELEASE_PLEASE_TOKEN is set
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PLEASE_TOKEN secret is not set. Create a fine-grained PAT scoped to this repository with Contents and Pull requests set to read and write, then add it to this repository's secrets."
            exit 1
          fi

      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Enable auto-merge for release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          pr_number=$(jq -r '.number' <<<"$RELEASE_PR")
          gh pr merge --merge --auto "$pr_number"
