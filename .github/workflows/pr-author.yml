name: PR author

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch the PR head object
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags --no-recurse-submodules origin "refs/pull/${PR_NUMBER}/head"
      - name: Synthetic acceptance
        run: python3 scripts/pr-author-gate-test.py
      - name: Check PR commit authors
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/pr-author-gate.py --base "$BASE" --head "$HEAD"
