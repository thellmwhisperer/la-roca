commands:
  lint: make fmt && make vet && make slop
  test: >-
    python3 scripts/public-text-test.py && make test playground-test fts-test audit-test vector-reader-test &&
    if [ -n "${ROCA_PUBLISHED_BIN:-}" ]; then make migrate-test; fi &&
    if [ -n "${ROCA_SNAPSHOT_PUBLISHED_BIN:-}" ]; then make snapshot-evidence; fi &&
    if [ -n "${ROCA_CODEX_PUBLISHED_BIN:-}" ]; then make codex-identity-test; fi &&
    if [ -n "${ROCA_D6_MODEL:-}" ]; then make model-verification-test; fi
document:
  instructions: |
    Follow CONTRIBUTING.md#public-text. Before writing the proposed PR body,
    pass its exact candidate text on stdin to python3 scripts/public-text.py --text.
    Replace every finding with the documented placeholders and repeat until clean.
    Run python3 scripts/public-text-test.py for paired synthetic reject/pass evidence.
    Carry the scrubbed text and this same check into the PR step; check the final
    title and body including generated testing/evidence sections before publishing.
    Keep raw local paths, hostnames, LAN addresses, session identifiers and exact
    corpus counts out of evidence summaries. Do not copy the rejected fixture into
    the PR body; report the paired outcomes using placeholders.
review:
  path_instructions:
    - path: "**"
      instructions: |
        Run lint and tests through the commands above (make fmt, vet, slop; make test and the suites).
        A finding is a defect against the linked issue's acceptance criteria, or one that breaks the
        repository's test, typecheck or lint commands. Hardening for a case the issue does not name is
        reported as a note and changes nothing.
auto_fix:
  review: 0  # the reviewer only reports; the agent that launched ATM answers every finding (Javi, 5-oct-2026)
ci:
  rerun_transient: 1  # a check GitHub cancels without a verdict is re-run once before anyone is asked
