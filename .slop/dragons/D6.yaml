schema: 1
id: D6
status: removed
category: adjacent_feature
title: "Repeated verification of an unchanged embedding model"
created_at: 2026-09-08
incident:
  intent: >
    Download and verify a pinned model once, then reuse it. Do not authenticate
    the same bytes twice per question on an unchanged local install.
  what_was_built: >
    startBackgroundSetup and Native.open both call model.Existing, which
    computes the full SHA-256 of the 957,680,480-byte model.
  justifying_sentence: "verified one-time model download"
  source: >
    INFORME-SLOP-ADYACENTE.md §3 D6 and §6 item 5; PR #237; companion of #335
    (D5); issue #350.
  cost: "Published lab: startup reads about 1.9 GB; direct hot companion about 958 MB; core hot shortcut zero. Same default federation and five evidence rows in each comparison."
rule: >
  Verify at download or replace. At open, compare file identity (size, mtime,
  inode or a stored digest of those) and only rehash when identity changed.
forbid:
  paths: []
  symbols: []
  strings:
    - 'plugins/vector/**/download.go::verifyFile(path, manifest.SHA256, manifest.Bytes)'
cost_test: >
  TestCostModelVerification observes download, unchanged open and replacement
  reads through lab-only instrumentation. docs/d6-model-evidence.md owns the
  published-versus-branch default-query comparison with result equality.
