schema: 1
id: D1
status: removed
category: adjacent_feature
title: "Read-only commands copied whole plugin databases into $TMPDIR"
created_at: 2026-09-08
incident:
  intent: >
    Run a SELECT locally without modifying data. SQLite already offers
    read-only connections and consistent read transactions.
  what_was_built: >
    A per-call copy of every plugin database plus lease, reaper, cursor and a
    manual cleanup procedure (internal/store/snapshot.go and snapshot_reaper.go).
  justifying_sentence: "without writing any rock"
  source: >
    INFORME-SLOP-ADYACENTE.md §3 D1 and §6 item 1; PR #228 (2026-08-21),
    reviewer round 3; PR #302; issue #341; removed by PR #342.
  cost: "797 lines + 490 test lines; 62 orphans / 92 GB on 2026-09-08"
rule: >
  Read-only access opens the live SQLite file with mode=ro. Nothing is copied
  to answer a query. Leftover directories from older binaries are doctor
  cleanup, not a new copy path.
forbid:
  paths:
    - "internal/store/snapshot.go"
    - "internal/store/snapshot_reaper.go"
  symbols:
    - "OpenReadOnlySnapshot"
    - "reapReadOnlySnapshots"
  # Published PATH lookup is forbidden in ordinary internal tests.
  # Evidence also takes an explicit executable path.
  strings:
    - 'internal/**_test.go::exec.LookPath("roca")'
    - 'internal/**_test.go::exec.Command("roca",'
