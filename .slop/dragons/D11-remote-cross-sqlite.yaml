schema: 1
id: D11
status: removed
category: adjacent_feature
title: "Remote cross reloaded Go rows into SQLite to concatenate them"
created_at: 2026-09-09
incident:
  intent: "Combine local and remote SELECT results in origin order."
  what_was_built: >
    Results already in Go were inserted into temporary SQLite tables and
    scanned back through UNION ALL.
  justifying_sentence: "Load the result sets into in-memory tables and UNION ALL"
  source: "INFORME-SLOP-ADYACENTE.md section 3 D11; issue #354"
  cost: >
    One SQLite connection, one table per origin, one INSERT per row and a
    second scan of every cell, solely to concatenate already loaded results.
rule: >
  Concatenate in Go, project missing columns to null and preserve the envelope.
  TestCostCrossNoSQLiteConnections observes zero SQLite connections while running
  the gather regressions, with a real connection as a positive control in an
  isolated subprocess; existing remote fixtures pin ordering and exact IDs.
forbid:
  symbols:
    - "loadCrossTable"
    - "sqliteValue"
