# What this repository tolerates, per scope. It is not a budget to spend.
#
# `check --enforce` fails when the measurement is above a ceiling (a regression)
# and when it is below one (an improvement nobody committed). Paying debt down
# means lowering the number in the same change, so the base branch always states
# the truth about how much duplication is actually in it.
#
# The ratchet is monotonic: these numbers may go down, never up. Raising one to
# make a build green only moves the line. If a clone is genuinely irreducible,
# it gets a tombstone in
# .slop/tombstones and stops counting as active, with its reason written down
# and reviewable, and the ceiling comes down by one all the same.
schema: 1
scopes:
  # The scope now also scans pkg/ and plugins/, which it never did. The rise
  # from zero to 56 is a wider scope and not new slack: most of it pairs
  # plugins/vector with code it copies from the core. Each copy given one owner
  # lowers this number; it never goes up.
  go_production:
    active_clones_ceiling: 54

  # The suites and the Gherkin harness. Most of what is left is the same fixture
  # assembled on either side of a package boundary, which Go cannot share without
  # a testing package of its own. It is real debt, written down as such: the
  # number comes down as those boundaries get a home, and it never goes up.
  #
  # The v1 model-only strip removed the compiler/classifier/teach/calibrate
  # suites, dropping the count from 24 to 23. The OSS sanitization sweep removed
  # the bench and hooks suites, dropping the count from 23 to 22. Sharing the
  # resident-corpus and ingest fixtures dropped the count to 17. Scanning pkg/,
  # plugins/ and scripts/ too raised the measure to 73: a wider scope and not
  # new slack.
  go_tests:
    active_clones_ceiling: 73

  # The markdown and public-surface blocks bootstrap today's census. They are
  # ratchets, not budgets: removing an orphan lowers the corresponding number,
  # and adding one fails the gate.
orphan_scopes:
  markdown:
    active_orphans_ceiling: 1
  # Down one again: the invocation-scoped export contract now names its CLI
  # owner directly from committed project memory.
  public_surfaces:
    active_orphans_ceiling: 10
