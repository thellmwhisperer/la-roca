schema: 1
id: T-CLI-PACKAGE-ENTRYPOINT
status: accepted
category: orphan
title: "CLI entrypoint is consumed through its Go package"
created_at: 2026-08-10
incident:
  pattern: >-
    A public Go source file is consumed through its package import rather than
    by a repository-relative reference to the file itself.
  what_went_wrong: >-
    The path census cannot resolve a Go package import to the individual file
    that owns the package entrypoint.
  root_cause: >-
    Public documentation used to mention the file path and accidentally hid
    this detector limitation; the public-tree cleanup removed that reference.
  rule_established: >-
    Keep the registered entrypoint in the census and accept only its exact
    fingerprint, so deleting or changing the surface makes this record stale.
  evidence:
    - family: orphan_fingerprint
      example: internal/distribution/cli/cli.go
match:
  family: orphan_fingerprint
  scope: public_surfaces
