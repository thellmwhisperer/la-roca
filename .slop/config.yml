# What the slop gate measures in this repository.
#
# Two duplication scopes, measured independently so production code cannot
# hide inside the test scope. Both sweep from the repository root because the
# product's code lives in three roots (`cmd/`, `internal/`, `test/`) and a clone
# copied from a command into a package is exactly the kind the gate exists to
# catch: scoping per directory would make it invisible.
#
# `features/` is the frozen Gherkin contract and is not duplication input;
# `bin/`, `dist/` and `.tmp/` are build output and gate caches. Embedded data
# stays visible to the public-surface census even though the Go scopes do not
# select it.
schema: 1

detector:
  name: jscpd
  version: "4.2.5" # must match the detector linked into the binary

defaults:
  format: go
  mode: mild
  min_lines: 5
  min_tokens: 50

global_ignore:
  - "**/.git/**"
  - "**/.tmp/**"
  - "**/.worktrees/**"
  # Agent-runtime state a coding agent drops in a checkout. `.gitignore` calls it
  # "never product content", and a census that walks it measures somebody's
  # node_modules: 31 vendored READMEs counted as orphaned public markdown.
  - "**/.opencode/**"
  - "**/.claude/**"
  - "bin/**"
  - "dist/**"
  - "features/**"

scopes:
  # Everything the shipped binary is made of.
  go_production:
    scan_path: .
    pattern: "{cmd,internal}/**/*.go"
    ignore:
      - "**/*_test.go"

  # The suites and the Gherkin step harness. Fixture-shaped repetition is
  # cheaper here than in production, so it gets its own ceiling and never
  # subsidises the production one.
  go_tests:
    scan_path: .
    pattern: "{cmd/**/*_test.go,internal/**/*_test.go,test/**/*.go}"

# Orphan scopes are repository surfaces, not language scans. A new public
# surface starts as active debt until something outside itself consumes it;
# the committed ceiling makes that addition fail closed.
orphan_scopes:
  markdown:
    files: ["**/*.md"]
    # `plugins/vector/` is an independent module whose README is that module's
    # own entry point, and the kernel's public documentation deliberately does
    # not advertise it. The exemption names that one file: every other plugin
    # README is a new public surface and stays active debt until something
    # outside itself consumes it.
    ignore: ["plugins/vector/README.md"]

  public_surfaces:
    files:
      - "internal/distribution/cli/*.go"
      - "internal/distribution/mcpplug/tools.go"
      - "data/*.{sql,yaml}"
      - "internal/distribution/skill/agents.md"
    ignore:
      - "**/*_test.go"
      - "internal/distribution/cli/execution_log.go"
      - "internal/distribution/cli/ingest_progress.go"
      - "internal/distribution/cli/reconcile.go"
      - "internal/distribution/cli/render.go"
      - "internal/distribution/cli/spinner.go"
      - "internal/distribution/cli/style.go"

# Claims select the same registered capability files. Any new registrator or
# embedded asset is therefore rejected until it points at a surviving scenario.
claims:
  file: .slop/claims.yml
  surfaces:
    commands_and_flags:
      files: ["internal/distribution/cli/*.go"]
      ignore:
        - "**/*_test.go"
        - "internal/distribution/cli/execution_log.go"
        - "internal/distribution/cli/ingest_progress.go"
        - "internal/distribution/cli/reconcile.go"
        - "internal/distribution/cli/render.go"
        - "internal/distribution/cli/spinner.go"
        - "internal/distribution/cli/style.go"
    mcp_tools:
      files: ["internal/distribution/mcpplug/tools.go"]
    embedded_assets:
      files:
        - "data/*.{sql,yaml}"
        - "internal/distribution/skill/agents.md"
