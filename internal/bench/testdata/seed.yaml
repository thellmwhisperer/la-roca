# Semilla de contraste del banco de consultas doradas.
#
# Esto NO es el banco de nadie y NO viaja en el binario: es una fixture de test,
# escrita por la autora de QA a partir de los escenarios de
# `features/05_banco_doradas.feature`, que sirve para dos cosas y solo dos:
#
#   1. Probar el formato y el runner sin depender del corpus de ningún usuario.
#   2. Dar un punto de contraste cuando el banco generado de un corpus real
#      empiece a dar notas raras.
#
# El banco de verdad lo genera cada instalación de SU propio corpus (adenda del
# capitán del 2026-08-05). Las preguntas y los centinelas de aquí abajo son los
# del mundo sembrado de la suite de aceptación, que es sintético por obligación
# de producto (PRD C5).
version: 1
generator: semilla-qa
notes: >
  Semilla derivada de features/05_banco_doradas.feature. Los centinelas son los
  del mundo sembrado "corpus-dorado", no los de ninguna base real.
cases:
  # --- agregados: la respuesta es exactamente el valor verdadero ---
  - id: agregado-contar-memorias-es
    question: cuantas memorias hay
    expect_path: compiler
    expect_template: count_memories
    expect_min_rows: 1
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-contar-memorias-en
    question: how many memories are there
    expect_path: compiler
    expect_template: count_memories
    expect_min_rows: 1
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-memorias-por-proyecto-es
    question: memorias por proyecto
    expect_path: compiler
    expect_template: count_memories_by_project
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-memorias-por-proyecto-en
    question: count memories by project
    expect_path: compiler
    expect_template: count_memories_by_project
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-memorias-por-agente
    question: count memories by source agent
    expect_path: compiler
    expect_template: count_memories_by_source_agent
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-exchanges-total
    question: how many exchanges
    expect_path: compiler
    expect_template: count_exchanges_total
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-exchanges-total-alt
    question: total exchanges
    expect_path: compiler
    expect_template: count_exchanges_total
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-thinking
    question: how many thinking blocks
    expect_path: compiler
    expect_template: count_thinking_blocks
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-herramientas
    question: how many tools did the agent use in total
    expect_path: compiler
    expect_template: count_tool_uses_total
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-proyectos-distintos
    question: distinct memory projects
    expect_path: compiler
    expect_template: distinct_memory_projects
    max_latency_ms: 250
    source: features/05 G-agregados

  - id: agregado-memorias-agrupadas
    question: memory count grouped by project
    expect_path: compiler
    expect_template: count_memories_by_project
    max_latency_ms: 250
    source: features/05 G-agregados

  # --- recall: lo sembrado aparece en la respuesta ---
  # Estos son los casos que de verdad separan a los tres competidores: los
  # agregados de arriba dan el mismo número por cualquier ruta.
  - id: recall-guiones-largos
    question: guiones largos
    expect_path: compiler
    expect_rows_contain: ["guiones largos"]
    expect_min_rows: 1
    max_latency_ms: 1000
    source: features/05 G-recall

  - id: recall-codigo-lanzamiento
    question: cual es el codigo de lanzamiento
    expect_rows_contain: ["ROCAE2E_TRINI_ALPHA_7741"]
    expect_min_rows: 1
    max_latency_ms: 1000
    source: features/05 G-recall

  - id: recall-feedback
    question: ultimos feedback
    expect_rows_contain: ["CENTINELA_FEEDBACK_DORADO"]
    expect_min_rows: 1
    max_latency_ms: 1000
    source: features/05 G-recall

  # --- negativas: se rechaza con motivo, no se adivina ---
  - id: rechazo-borrar-es
    question: borra todas las memorias
    expect_path: refused
    expect_refusal: out_of_scope
    expect_empty: true
    source: features/05 G-rechazo

  - id: rechazo-borrar-en
    question: delete all memories
    expect_path: refused
    expect_refusal: out_of_scope
    expect_empty: true
    source: features/05 G-rechazo

  - id: rechazo-saludo
    question: hola
    expect_path: refused
    expect_refusal: out_of_scope
    expect_empty: true
    source: features/05 G-rechazo

  - id: rechazo-poema
    question: escribe un poema
    expect_path: refused
    expect_refusal: out_of_scope
    expect_empty: true
    source: features/05 G-rechazo

  - id: rechazo-ambigua
    question: sesiones
    expect_path: refused
    expect_refusal: ambiguous
    expect_empty: true
    source: features/05 G-rechazo

  # --- vacío honesto: dominio ajeno no se inventa ---
  - id: vacio-dominio-ajeno
    question: que tiempo hace en madrid
    expect_empty: true
    max_latency_ms: 1000
    source: features/05 G-vacio

  # --- paridad entre idiomas: la misma pregunta compila igual ---
  - id: paridad-feedback-es
    question: que feedback tenemos
    expect_path: compiler
    max_latency_ms: 250
    source: features/05 G-paridad

  - id: paridad-feedback-en
    question: show me the latest feedback
    expect_path: compiler
    max_latency_ms: 250
    source: features/05 G-paridad

  - id: paridad-herramientas-es
    question: que herramientas uso mas el agente
    expect_path: compiler
    max_latency_ms: 250
    source: features/05 G-paridad

  - id: paridad-herramientas-en
    question: top used tools
    expect_path: compiler
    max_latency_ms: 250
    source: features/05 G-paridad

  # --- no contradicción: un filtro no se resuelve con el agregado ---
  - id: nocontradiccion-menciona-go
    question: cuantas memorias mencionan Go
    expect_path: compiler
    max_latency_ms: 1000
    source: features/05 G-nocontradiccion
