version: 1
attachment: on-demand
description: Recorded cron train journeys and their observed outcomes.
custody: true
questions:
  - Which cron rides ran and what happened?
tables:
  - name: journeys
    description: One observed invocation or deferred ride in a cron train.
    columns:
      - id
      - train
      - ride
      - plugin
      - started_at
      - ended_at
      - duration_ms
      - exit_code
      - error
      - gate_status
      - stdout
      - stderr
  - name: legacy_runs
    description: Quarantined legacy execution runs retained without fabricating journey fields.
    columns: [canonical_digest, payload]
  - name: legacy_run_logs
    description: Quarantined legacy run messages retained with their source payload.
    columns: [canonical_digest, payload]
  - name: plugin_schema
    description: The cron database schema version and migration state; cron has no derived index.
    columns: [singleton, plugin_name, schema_version, index_version, migration_state, verification_digest, prepared_at, verified_at, updated_at]
  - name: migration_batches
    description: Fully committed, checksummed source batches imported into cron custody.
    columns: [batch_id, source_database, source_table, row_count, canonical_digest, high_water_mark, committed_at]
  - name: custody_memberships
    description: Source identities represented by each physical row in cron custody.
    columns: [source_database, source_table, source_key, destination_table, destination_key, canonical_digest, batch_id]
